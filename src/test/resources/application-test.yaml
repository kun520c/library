library:
  jwt:
    secret: test-only-jwt-secret-at-least-32-bytes-long
    expiration: 12h
  cache:
    book:
      key-prefix: "test:book:"
      null-value: "__NULL__"
      ttl: 10m
      null-ttl: 1m
  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  level:
    root: warn

spring:
  datasource:
    url: jdbc:h2:mem:librarytest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  data:
    redis:
      host: 127.0.0.1
      port: 1
