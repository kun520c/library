server:
  port: 8080

spring:
  application:
    name: library-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  jackson:
    deserialization:
      fail-on-unknown-properties: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true

library:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:12h}
  cache:
    book:
      key-prefix: "library:book:"
      null-value: "__NULL__"
      ttl: ${BOOK_CACHE_TTL:10m}
      null-ttl: ${BOOK_NULL_CACHE_TTL:1m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: info
    com.library: info
